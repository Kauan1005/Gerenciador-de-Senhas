plugins = []
redirects = []

[functions]

[functions."*"]

[build]
publish = "C:\\DISPAROS\\Gerenciador-de-Senhas\\dist"
publishOrigin = "config"
commandOrigin = "config"
command = "node scripts/build.mjs"

[build.environment]
NODE_VERSION = "20"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://drtrifievfcjhvgjepcq.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), clipboard-write=(self), clipboard-read=(self)"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
Cache-Control = "no-cache"

[[headers]]
for = "/js/config.js"

[headers.values]
Cache-Control = "no-store"

[[headers]]
for = "/vendor/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"